name: Android CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Build, lint, and verify
        run: bash scripts/ci-build.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Agentic-Hydra-preview
          path: |
            dist/*.apk
            app/build/reports/lint-results-release.html
            app/build/reports/tests/testReleaseUnitTest/
            app/build/reports/screenshots/
